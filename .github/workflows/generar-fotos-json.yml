name: Generar fotos.json

on:
  push:
    paths:
      - 'fotos/**'
      - '.github/workflows/generar-fotos-json.yml'

permissions:
  contents: write

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar fotos.json
        run: |
          python3 << 'PY'
          import os
          import json

          carpeta = "fotos"
          extensiones = (".jpg", ".jpeg", ".png", ".webp")

          fotos = []

          if os.path.isdir(carpeta):
              for archivo in sorted(os.listdir(carpeta)):
                  if archivo.lower().endswith(extensiones):
                      fotos.append(f"{carpeta}/{archivo}")

          with open("fotos.json", "w", encoding="utf-8") as f:
              json.dump(fotos, f, ensure_ascii=False, indent=2)

          print(f"Generadas {len(fotos)} fotos")
          PY

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guardar fotos.json
        run: |
          git add fotos.json
          git commit -m "Actualizar fotos.json automaticamente" || echo "No hay cambios para guardar"
          git pull --rebase origin main
          git push origin main       
