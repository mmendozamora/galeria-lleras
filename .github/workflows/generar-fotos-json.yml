name: Generar fotos.json

on:
  push:
    paths:
      - 'fotos/**'

permissions:
  contents: write

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar fotos.json
        run: |
          python3 << 'PY'
          import os
          import json

          carpeta = "fotos"
          extensiones = (".jpg", ".jpeg", ".png", ".webp")

          fotos = []

          if os.path.isdir(carpeta):
              for archivo in sorted(os.listdir(carpeta)):
                  if archivo.lower().endswith(extensiones):
                      fotos.append(f"{carpeta}/{archivo}")

          with open("fotos.json", "w", encoding="utf-8") as f:
              json.dump(fotos, f, ensure_ascii=False, indent=2)

          print(f"Generadas {len(fotos)} fotos")
          PY

      - name: Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Actualizar fotos.json automaticamente
          file_pattern: fotos.json
