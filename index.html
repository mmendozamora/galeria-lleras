<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galería Llerista</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      background: #000;
      transition: opacity 1s ease;
    }
  </style>
</head>

<body>

<img id="slide" src="">

<script>
  let fotos = [];
  let actual = 0;

  async function cargarFotos() {
    try {
      const respuesta = await fetch("fotos.json?nocache=" + Date.now());
      fotos = await respuesta.json();

      if (!fotos.length) return;

      const slide = document.getElementById("slide");

      slide.src = fotos[0];

      setInterval(() => {
        actual = (actual + 1) % fotos.length;

        slide.style.opacity = 0;

        setTimeout(() => {
          slide.src = fotos[actual];
          slide.style.opacity = 1;
        }, 500);

      }, 8000);

    } catch(error){
      console.error("Error cargando fotos:", error);
    }
  }

  cargarFotos();
</script>

</body>
</html>
