<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <title>Galería Llerista</title>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: opacity 1s ease;
    }

  </style>
</head>

<body>

  <img id="slide" src="fotos/foto1.jpg">

  <script>

    const fotos = [
      "fotos/foto1.jpg",
      "fotos/foto2.jpg",
      "fotos/foto3.jpg"
    ];

    let actual = 0;

    setInterval(() => {

      actual = (actual + 1) % fotos.length;

      document.getElementById("slide").src = fotos[actual];

    }, 8000);

  </script>

</body>
</html>
