<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galería Llerista</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      transition: opacity 1s ease;
    }
  </style>
</head>

<body>
  <img id="slide" src="">

  <script>
    let fotos = [];
    let actual = 0;

    async function cargarFotos() {
      const respuesta = await fetch("fotos.json?nocache=" + Date.now());
      fotos = await respuesta.json();

      if (!fotos.length) return;

      document.getElementById("slide").src = fotos[0];

      setInterval(() => {
        actual = (actual + 1) % fotos.length;
        document.getElementById("slide").src = fotos[actual];
      }, 8000);
    }

    cargarFotos();
  </script>
</body>
</html>
