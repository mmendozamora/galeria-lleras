<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <title>Galería Llerista</title>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      transition: opacity 1s ease;
    }

  </style>

</head>

<body>

  <img id="slide" src="fotos/IMG-20250515-WA0056.jpg">

  <script>

    const fotos = [

      "fotos/IMG-20250515-WA0056.jpg",
      "fotos/IMG-20250523-WA0020.jpg",
      "fotos/IMG-20250528-WA0010(1).jpg",
      "fotos/IMG-20250606-WA0003.jpg",
      "fotos/IMG-20250728-WA0026.jpg",
      "fotos/IMG-20250830-WA0008.jpg",
      "fotos/IMG-20250912-WA0038.jpg",
      "fotos/IMG-20250926-WA0048.jpg",
      "fotos/IMG-20251004-WA0031.jpg",
      "fotos/IMG-20251021-WA0059.jpg",
      "fotos/IMG-20251130-WA0044.jpg",
      "fotos/IMG-20260127-WA0040.jpg",
      "fotos/IMG-20260212-WA0015.jpg",
      "fotos/IMG-20260311-WA0014.jpg",
      "fotos/IMG-20260311-WA0044(1).jpg",
      "fotos/IMG-20260423-WA0038.jpg",
      "fotos/IMG-20260514-WA0004.jpg"

    ];

    let actual = 0;

    setInterval(() => {

      actual = (actual + 1) % fotos.length;

      document.getElementById("slide").src = fotos[actual];

    }, 8000);

  </script>

</body>

</html>
